# CI (docs/PLAN.md 11.7): check, test, build once, assert the single file and upload the
# course-html artifact; then e2e over file:// against that same file. While the course is in
# early iteration, e2e runs Chromium only; a manual run with all-browsers adds Firefox and WebKit.
# release.yml calls this workflow with skip-e2e and publishes the artifact from the build job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      skip-e2e:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      all-browsers:
        description: Run e2e on Firefox and WebKit too
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to the same ref supersedes the run in flight instead of queueing behind it.
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (release binary, checksum-pinned)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  build:
    name: Check, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The Pages URL comes from GITHUB_REPOSITORY (scripts/pages-url.mjs).
      COURSE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      COURSE_RELEASE: ${{ github.ref_type == 'tag' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs Node from .node-version and runs `vp install`, which installs pnpm 12.14.0 from
      # devEngines. pnpm verifies the frozen lockfile against the release-age gate (D-31).
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Format, lint and type check
        run: vp check
      - name: Unit, content and widget tests
        run: vp test
      - name: Generated modules are up to date
        run: vp run gen:case --check
      - name: Build the single file
        run: vp build
      - name: Assert one self-contained file within budget
        run: node scripts/check-dist.mjs dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: course-html
          path: dist/index.html
          if-no-files-found: error
          retention-days: 14

  # E2E reports its failures but does not block merges while the known failures are open:
  # phone-width overflow at 360 px in CI's Chromium and WebKit (lessons 6 and 7), and the
  # keyboard-only walk timing out in Firefox. Remove continue-on-error once those are fixed.
  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    if: ${{ !inputs.skip-e2e }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.all-browsers && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: course-html
          path: dist
      - name: Install Playwright browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: vp exec playwright install --with-deps "$BROWSER"
      - name: E2E on the built file over file://
        env:
          BROWSER: ${{ matrix.browser }}
        run: vp exec playwright test --project "$BROWSER"
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
