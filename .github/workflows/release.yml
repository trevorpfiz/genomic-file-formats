# Release (docs/PLAN.md 11.7, D-33): on a vX.Y.Z tag, build once through ci.yml (without e2e,
# which already ran on main), then attach that file to a GitHub Release and deploy the same
# bytes to Pages. A manual run is a dry run: it builds and names the release files but
# publishes nothing.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag filter above still admits leading zeros (v01.2.3); SemVer does not.
  tag:
    name: Strict SemVer tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check the tag is vMAJOR.MINOR.PATCH
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag ${TAG} is not a strict SemVer release tag (vMAJOR.MINOR.PATCH, no leading zeros)."
            exit 1
          fi

  ci:
    name: CI
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      skip-e2e: true
    permissions:
      contents: read

  github-release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: course-html
          path: release
      - name: Name the file and write its checksum
        id: files
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          name="genomic-file-formats-${REF_NAME//\//-}.html"
          mv release/index.html "release/${name}"
          (cd release && sha256sum "${name}" > "${name}.sha256" && cat "${name}.sha256")
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - name: Create the release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.files.outputs.name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            "release/${NAME}" "release/${NAME}.sha256"
      - name: Dry run summary
        if: github.event_name != 'push'
        env:
          NAME: ${{ steps.files.outputs.name }}
        run: |
          {
            echo "### Release dry run"
            echo "Would attach \`${NAME}\` and \`${NAME}.sha256\`; a vX.Y.Z tag push publishes them and deploys Pages."
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploys only after the Release exists, so the hosted page is always a released file (D-33).
  pages:
    name: GitHub Pages
    needs: [ci, github-release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: course-html
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
