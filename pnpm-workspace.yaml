# Vite+ owns the `vite` name: the catalog maps it to its core, and the override
# makes every transitive `vite` resolve to the same copy (shape generated by vite-plus 1.3.0).
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# `vp add` writes exact versions; every dependency is pinned exactly.
savePrefix: ""

# Release-age gate (docs/PLAN.md D-31): 14 days, in minutes.
minimumReleaseAge: 20160
# The owner-pinned toolchain and its exact-pinned closure. Patterns need pnpm >= 10.17 (V-42).
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - vitest
  - "@vitest/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - "@oxc-project/*"
  - vite-plugin-singlefile
  # Found from the lockfile in M0 (V-42): vite-plus-core 1.3.0 pins yuku-parser =0.19.0,
  # which pins yuku-core =0.19.0 and its platform bindings.
  - yuku-parser
  - yuku-core
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
  # Range floors in the same closure that are younger than 14 days; excluded by exact
  # version only, so a newer immature release is still refused.
  - postcss@8.5.29 # vite-plus-core 1.3.0: ^8.5.29
  - magic-string@1.4.3 # vitest 5.0.5: ^1.4.3
  - tinybench@6.2.2 # vitest 5.0.5: ^6.2.2
