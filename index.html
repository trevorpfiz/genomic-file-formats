<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Before first paint: mark that scripts run (the static fallback is then hidden while the
         app boots) and apply a saved Light or Dark theme, so there is no flash (ux 6.5). -->
    <script>
      (function () {
        var root = document.documentElement;
        root.className += " js";
        try {
          var theme = localStorage.getItem("genomic-file-formats:theme");
          if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <script nomodule>
      document.documentElement.className = document.documentElement.className.replace(" js", "");
    </script>
    <meta name="description" content="An interactive course on the file formats of genomics." />
    <title>Genomic File Formats</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 3c14 6 0 20 14 26M23 3C9 9 23 23 9 29' stroke='%230B6B66' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <noscript>
      <p class="noscript">
        JavaScript is off. This interactive course needs JavaScript. Save the file and open it in a desktop
        browser, or use <a href="%PAGES_URL%">%PAGES_URL%</a>.
      </p>
    </noscript>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar" id="topbar" hidden></header>
    <div class="layout">
      <main id="main" tabindex="-1">
        <div id="fallback" class="fallback">
          <h1>Genomic File Formats</h1>
          <p>An interactive course on the file formats of genomics, from FASTA to GFA.</p>
          <p>
            This interactive course needs JavaScript. Save the file and open it in a desktop browser, or use
            <a href="%PAGES_URL%">%PAGES_URL%</a>.
          </p>
        </div>
      </main>
      <aside id="aside" class="aside" aria-label="Course navigation"></aside>
    </div>
    <footer class="site-footer" id="footer"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
